# Local mosquitto config for running the Atlantico server locally
# This config is intentionally permissive for local development only.

# Allow anonymous connections (local development)
allow_anonymous true

# Listen only on localhost to avoid exposing broker to network
# listener 1883 127.0.0.1
listener 1883 0.0.0.0

# Pid file and persistence
pid_file run/mosquitto.pid
persistence false

# Log to file inside the repo run/logs
log_dest file run/logs/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# No password file or ACL to keep it simple for local runs

# Do not include system config
